name: voice-samples
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TA_MODEL: ${{ github.workspace }}/reel/models/ml      # name kept for the reel code; Malayalam model now
      ML_MODEL: ${{ github.workspace }}/reel/models/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: reel/requirements.txt}
      - name: Malayalam voice model (cached)
        id: model
        uses: actions/cache@v4
        with: {path: reel/models/ml, key: indic-tts-ml-v1}
      - name: Download voice model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p reel/models
          curl -sL -o /tmp/ml.zip https://github.com/AI4Bharat/Indic-TTS/releases/download/v1-checkpoints-release/ml.zip
          unzip -q /tmp/ml.zip -d reel/models && rm /tmp/ml.zip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r reel/requirements.txt gTTS scipy
      - run: python tools/voice_samples.py
      - name: Commit samples
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f samples/voices
          git commit -m "voice samples" || echo none
          git pull --rebase --autostash origin main
          git push
